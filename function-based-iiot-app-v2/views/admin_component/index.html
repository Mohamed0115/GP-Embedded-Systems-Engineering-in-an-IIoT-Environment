<!DOCTYPE html>
<html class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Component</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
              800: '#166534', 900: '#14532d', 950: '#052e16', DEFAULT: '#22c55e'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: transparent !important;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    /* Smooth row hover */
    .user-row {
      transition: background-color 0.15s ease;
    }
    /* Button hover effects */
    .btn-action {
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    .btn-action:hover {
      transform: translateY(-1px);
    }
    .btn-action:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-transparent text-gray-900 dark:text-gray-100 antialiased p-1">

  <div id="app" class="w-full">
    <!-- ===== Header Section ===== -->
    <div class="flex flex-row justify-between items-center border-gray-200 dark:border-gray-700 py-3.5 border-b mb-4">
      <div class="flex flex-row items-center space-x-3">
        <!-- Shield icon -->
        <svg class="size-6 text-gray-700 dark:text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
        </svg>
        <div>
          <p class="font-semibold text-lg text-gray-900 dark:text-gray-100">User Management</p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Manage system access, assign roles, and configure employee credentials.</p>
        </div>
      </div>
      <div class="flex flex-row space-x-2">
        <!-- Add Account Button -->
        <button onclick="triggerAction('add_user', '', '')" class="focus:outline-none flex-shrink-0 font-medium rounded-md text-sm gap-x-1.5 px-3 py-1.5 shadow-sm text-white bg-primary-500 hover:bg-primary-600 inline-flex items-center" type="button">
          <svg class="flex-shrink-0 h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Add Account
        </button>
      </div>
    </div>

    <!-- ===== Search Bar ===== -->
    <div class="mb-4 max-w-sm">
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
        <input id="search-input" type="text" placeholder="Filter by Name, Username, or Email..." oninput="filterUsers(this.value)"
          class="w-full pl-9 pr-3 py-2 text-sm rounded-md border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500" />
      </div>
    </div>

    <!-- ===== Users Table ===== -->
    <div class="border border-gray-200 dark:border-gray-800 rounded-lg overflow-hidden bg-white dark:bg-gray-900 shadow-sm">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-300 dark:divide-gray-700 text-left">
          <thead class="bg-gray-50 dark:bg-gray-800/50">
            <tr>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">ID</th>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Name</th>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Role</th>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Username</th>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Email</th>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Contact</th>
              <th class="px-4 py-3 text-left text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Password</th>
              <th class="px-4 py-3 text-center text-gray-900 dark:text-white font-semibold text-xs uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody" class="divide-y divide-gray-200 dark:divide-gray-800">
            <tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ===== Streamlit Communication Protocol =====
    const sendMessage = (type, data = {}) => {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    };

    const triggerAction = (action, userId, extra) => {
      sendMessage("streamlit:setComponentValue", { value: { action, user_id: userId, extra, _ts: Date.now() } });
    };

    // Listen to messages from Streamlit
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (msg.type === "streamlit:render") {
        allUsers = msg.args.users || [];
        // Re-apply any active search filter after re-render
        const searchInput = document.getElementById("search-input");
        if (searchInput && searchInput.value.trim()) {
          filterUsers(searchInput.value);
        } else {
          renderUsers(allUsers);
        }
      }
    });

    // Notify Streamlit that component is ready
    sendMessage("streamlit:componentReady", { apiVersion: 1 });

    // Auto height
    const resizeObserver = new ResizeObserver(() => {
      const height = document.documentElement.scrollHeight || document.body.scrollHeight;
      sendMessage("streamlit:setFrameHeight", { height: height + 10 });
    });
    resizeObserver.observe(document.body);

    // ===== State =====
    let allUsers = [];

    // ===== Filter users by search term =====
    function filterUsers(term) {
      const lower = (term || "").toLowerCase();
      if (!lower) {
        renderUsers(allUsers);
        return;
      }
      const filtered = allUsers.filter(u =>
        u.name.toLowerCase().includes(lower) ||
        u.username.toLowerCase().includes(lower) ||
        (u.email || '').toLowerCase().includes(lower) ||
        (u.role || '').toLowerCase().includes(lower)
      );
      renderUsers(filtered);
    }

    // ===== Role badge color mapping =====
    function getRoleBadge(role) {
      let bg, text, ring;
      if (role.includes("Admin")) {
        bg = "bg-red-50 dark:bg-red-400/10";
        text = "text-red-700 dark:text-red-400";
        ring = "ring-red-600/10 dark:ring-red-400/20";
      } else if (role.includes("Vibration")) {
        bg = "bg-blue-50 dark:bg-blue-400/10";
        text = "text-blue-700 dark:text-blue-400";
        ring = "ring-blue-600/10 dark:ring-blue-400/20";
      } else {
        bg = "bg-green-50 dark:bg-green-400/10";
        text = "text-green-700 dark:text-green-400";
        ring = "ring-green-600/10 dark:ring-green-400/20";
      }
      return `<span class="inline-flex items-center font-medium rounded-md text-xs px-2 py-0.5 ${bg} ${text} ring-1 ring-inset ${ring}">${role}</span>`;
    }

    // ===== Render the users table =====
    function renderUsers(users) {
      const tbody = document.getElementById("users-tbody");

      if (!users || users.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="px-4 py-8 text-center text-gray-400 text-sm">
              No accounts match your search query.
            </td>
          </tr>`;
        return;
      }

      let html = "";
      users.forEach(user => {
        html += `
          <tr class="user-row hover:bg-gray-50 dark:hover:bg-gray-800/40">
            <!-- ID column with monospace code badge -->
            <td class="whitespace-nowrap px-4 py-3 text-sm">
              <span class="bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 px-2 py-0.5 rounded font-mono text-xs">${user.id}</span>
            </td>
            <!-- Name -->
            <td class="whitespace-nowrap px-4 py-3 text-sm font-semibold text-gray-800 dark:text-gray-200">${user.name}</td>
            <!-- Role Badge -->
            <td class="whitespace-nowrap px-4 py-3 text-sm">${getRoleBadge(user.role)}</td>
            <!-- Username -->
            <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-600 dark:text-gray-400">${user.username}</td>
            <!-- Email -->
            <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-600 dark:text-gray-400">${user.email || '-'}</td>
            <!-- Contact -->
            <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-500">${user.contact || '-'}</td>
            <!-- Password (masked) -->
            <td class="whitespace-nowrap px-4 py-3 text-sm text-gray-400 tracking-widest">••••••••</td>
            <!-- Action Buttons: Logs, Edit, Delete -->
            <td class="whitespace-nowrap px-4 py-3 text-sm">
              <div class="flex items-center justify-center space-x-1.5">
                <!-- Change 5b: Logs button -->
                <button onclick="triggerAction('view_user_logs', '${user.id}', '${user.name}')"
                  class="btn-action inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-purple-50 text-purple-700 hover:bg-purple-100 dark:bg-purple-900/30 dark:text-purple-400 dark:hover:bg-purple-800/40 ring-1 ring-inset ring-purple-600/10 dark:ring-purple-400/20"
                  title="View Activity Logs" type="button">
                  <svg class="h-3.5 w-3.5 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
                  </svg>
                  Logs
                </button>
                <!-- Edit button -->
                <button onclick="triggerAction('edit_user', '${user.id}', '')"
                  class="btn-action inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-green-50 text-green-700 hover:bg-green-100 dark:bg-green-900/30 dark:text-green-400 dark:hover:bg-green-800/40 ring-1 ring-inset ring-green-600/10 dark:ring-green-400/20"
                  title="Edit Account" type="button">
                  <svg class="h-3.5 w-3.5 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                  </svg>
                  Edit
                </button>
                <!-- Delete button -->
                <button onclick="triggerAction('delete_user', '${user.id}', '${user.name}')"
                  class="btn-action inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-red-50 text-red-700 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-400 dark:hover:bg-red-800/40 ring-1 ring-inset ring-red-600/10 dark:ring-red-400/20"
                  title="Delete Account" type="button">
                  <svg class="h-3.5 w-3.5 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                  </svg>
                  Delete
                </button>
              </div>
            </td>
          </tr>`;
      });

      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
